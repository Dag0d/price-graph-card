name: HACS Validation

on:
  workflow_dispatch:
    inputs:
      category:
        description: HACS category
        required: true
        type: string
      ignore:
        description: Space separated ignore list
        required: false
        default: images
        type: string
      repository_ref:
        description: Ref to validate
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      REPOSITORY_REF: ${{ inputs.repository_ref }}
    steps:
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: ${{ inputs.category }}
          ignore: ${{ inputs.ignore }}
