name: HACS Validation
run-name: HACS Validation ${{ inputs.bridge_run_token }}

on:
  workflow_dispatch:
    inputs:
      repository_ref:
        description: Ref to validate
        required: true
        type: string
      bridge_run_token:
        description: Internal bridge dispatch correlation token
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      REPOSITORY_REF: ${{ inputs.repository_ref }}
    steps:
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: "plugin"
          ignore: "images"
